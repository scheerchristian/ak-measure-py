[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akmeasure"
version = "0.1.0"
description = "Impulse response measurement with pyfar, a Python port of AKtools' AKmeasureDemo.m"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "pyyaml",
    "sounddevice",
    "pyfar",
]

[project.scripts]
akmeasure = "akmeasure.measure:main"
akmeasure-io-setup = "akmeasure.io_setup:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
akmeasure = ["config_defaults/*.yaml"]
